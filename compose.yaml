services:
  mongo:
    image: mongo:8.0
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval ''try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}] }).ok }'' | grep 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    ports: ['127.0.0.1:3000:3000']
    environment:
      HOST: 0.0.0.0
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      API_KEY: ${API_KEY:-local-review-key-change-me}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mongo-data:
