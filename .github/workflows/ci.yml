name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build -d
      - name: Verify running container and worker import
        run: |
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/health
          curl --fail -H 'x-api-key: local-review-key-change-me' -F 'file=@examples/sample.csv' http://127.0.0.1:3000/api/imports > /tmp/import.json
          node -e "const r=require('/tmp/import.json'); if(r.succeeded !== 3 || r.rejected !== 0) process.exit(1)"
      - if: always()
        run: docker compose logs && docker compose down -v
